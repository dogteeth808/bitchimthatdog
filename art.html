<html lang="en-us">
  <head>

    <link href="/newstyley.css" rel="stylesheet" type="text/css" media="all">
    <link href="/assets/icons/favicon.png" rel="icon" type="text/css">
    <style>body {background-position: center;} body::before {background-image: radial-gradient(rgba(0,0,0,0))}</style>

  <body onload="compileMusicEntries();" style="overflow: hidden; background-image: url(/assets/backgrounds/jadee-art-room.avif);">
  
  <div style="display: flex; height: 100vh;">
  
    <!-- 1 ( our main 4:3 viewport) -->
    <div class="framey pageframe" style="flex-direction: column; color: rgba(0,0,0,0); ">

      <div style="flex-grow: 1; width: 100%; display: flex; flex-direction: row; justify-content: space-evenly; align-items: center;">
        <div style="aspect-ratio: 3 / 4; height: 95%; position: relative; top: 20%; display: flex; flex-direction: column; align-items: center; transform: rotate3d(4, -4, -1, 0.01turn)">
          <div style="width: 46vh; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-top: 3vh; z-index: 1; border: ridge 2vh #c7a700; border-radius: 1vh; box-sizing: border-box;">
            <a style="width: 100%; display: flex;" href="https://mentholgrrl.neocities.org/art"><img style="width: 100%; aspect-ratio: 1 / 1;" src="assets/artworks/2023_11_29_seafoam.jpg"></a>
          </div>
          <div style="position: absolute; height: 50vh; width: 5vh; background-color: #722900; top: 24%; right: 40%; transform: skew(20deg); z-index: 0;"></div>
          <div style="position: absolute; height: 50vh; width: 5vh; background-color: #722900; top: 24%; left: 40%; transform: skew(-20deg); z-index: 0;"></div>
        </div>
        
        <div style="aspect-ratio: 3 / 4; height: 90%; box-sizing: border-box;"></div>
      </div>
      <div style="height: 18%; width: 100%; "></div>
